<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DormLaundry - reserve dormitory washing machines and manage laundry room equipment."
    />
    <meta name="theme-color" content="#102f4b" />
    <title>DormLaundry</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%23128886'/%3E%3Ccircle cx='24' cy='24' r='15' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="DormLaundry home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img">
              <circle cx="24" cy="24" r="18"></circle>
              <circle class="brand-mark-inner" cx="24" cy="24" r="9"></circle>
              <path d="M16 9h16"></path>
            </svg>
          </span>
          <span>
            <strong>DormLaundry</strong>
            <small>SE-2622 laundry room</small>
          </span>
        </a>

        <div class="topbar-actions">
          <span id="modeBadge" class="mode-badge">Demo mode</span>
          <button id="bellButton" class="icon-button bell-button is-hidden" type="button" aria-label="Notifications" title="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path>
              <path d="M10 21h4"></path>
            </svg>
            <span id="bellCount" class="bell-count is-hidden">0</span>
          </button>
          <button id="soundButton" class="icon-button" type="button" aria-pressed="false" aria-label="Turn on sound alerts" title="Sound alerts: off">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z"></path>
              <path class="sound-waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path>
              <path class="sound-off" d="m16 9 5 6m0-6-5 6"></path>
            </svg>
          </button>
          <button id="helpButton" class="icon-button" type="button" aria-label="Open help">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.8 9a2.4 2.4 0 1 1 3.7 2c-1 .6-1.5 1.1-1.5 2"></path>
              <path d="M12 17h.01"></path>
            </svg>
          </button>
          <button id="logoutButton" class="ghost-button is-hidden" type="button">Sign out</button>
        </div>
      </header>

      <main id="app" class="app-main" tabindex="-1"></main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog id="appDialog" class="dialog">
      <form id="dialogForm" method="dialog">
        <div class="dialog-head">
          <div>
            <p id="dialogEyebrow" class="eyebrow"></p>
            <h2 id="dialogTitle"></h2>
          </div>
          <button class="icon-button dialog-close" type="button" aria-label="Close dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>
        <div id="dialogBody" class="dialog-body"></div>
        <div id="dialogActions" class="dialog-actions"></div>
      </form>
    </dialog>

    <script src="./config.js"></script>
    <script src="./sounds.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
